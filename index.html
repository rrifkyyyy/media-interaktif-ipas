<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pemutar Video</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    .video-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
    }
    .video-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>
<body>
  <div class="video-wrapper">
    <iframe
      id="yt"
      title="Video YouTube"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
      referrerpolicy="strict-origin-when-cross-origin"
      allowfullscreen>
    </iframe>
    <script>
      // Menambahkan parameter origin otomatis sesuai alamat halaman (GitHub Pages)
      var origin = location.protocol.startsWith("http") ? "&origin=" + encodeURIComponent(location.origin) : "";
      document.getElementById("yt").src =
        "https://www.youtube.com/embed/KAXI_CNDTJc?rel=0&playsinline=1&enablejsapi=1" + origin;
    </script>
  </div>
</body>
</html>
